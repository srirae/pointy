[package]
name = "pointy-software"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pointy_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# live microphone capture (input device enumeration + level streaming)
cpal = "0.18.1"
# band magnitudes for the mic visualiser; also the basis for wake-word framing in Phase 3
rustfft = "6.4.1"
tauri-plugin-store = "2"
xcap = "0.9.8"
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "blocking", "native-tls"] }

# Windows reads the keyboard through GetAsyncKeyState (see hotkey/windows.rs).
# Other platforms use rdev's event tap.
[target.'cfg(not(windows))'.dependencies]
rdev = "0.5.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Security_Authorization_AppCapabilityAccess",
    "Foundation",
] }

# macOS permission plumbing. Scaffolded, compiled only on macOS, untested on this machine.
# CoreGraphics / ApplicationServices entry points are declared as extern "C" in
# permissions/macos.rs, so only the AVFoundation class call needs the objc2 runtime.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

